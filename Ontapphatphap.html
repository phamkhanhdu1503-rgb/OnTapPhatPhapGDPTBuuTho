<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Ôn Tập Trắc Nghiệm</title>
    <style>
        :root {
            --bg-main: #f4f7f2;
            --bg-card: #ffffff;
            --primary: #5c7a54;       /* Xanh bơ trầm dịu mắt */
            --primary-light: #e7efe4;
            --primary-hover: #496342;
            --accent: #d9a05b;        /* Kem ấm */
            --text-main: #2c3529;
            --text-muted: #6b7867;
            --border: #dce4d8;
            --success: #2e7d32;
            --success-bg: #e8f5e9;
            --danger: #c62828;
            --danger-bg: #ffebee;
            --shadow: 0 4px 16px rgba(44, 53, 41, 0.06);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            line-height: 1.5;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 300px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 20px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .brand {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Khu vực Upload JSON */
        .upload-box {
            border: 2px dashed var(--primary);
            background: var(--primary-light);
            border-radius: var(--radius);
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 20px;
        }

        .upload-box:hover, .upload-box.dragover {
            background: #dce8d7;
            border-color: var(--primary-hover);
        }

        .upload-box p {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary-hover);
        }

        .upload-box span {
            font-size: 0.78rem;
            color: var(--text-muted);
            display: block;
            margin-top: 4px;
        }

        #jsonInput {
            display: none;
        }

        .topic-header {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .topic-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .topic-item {
            padding: 12px 14px;
            border-radius: 10px;
            background: var(--bg-main);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .topic-item:hover {
            border-color: var(--primary);
        }

        .topic-item.active {
            background: var(--primary);
            color: #fff;
        }

        .topic-info {
            overflow: hidden;
        }

        .topic-title {
            font-weight: 600;
            font-size: 0.92rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topic-meta {
            font-size: 0.78rem;
            opacity: 0.85;
        }

        .btn-delete-topic {
            background: none;
            border: none;
            color: inherit;
            opacity: 0.6;
            cursor: pointer;
            padding: 4px 6px;
            font-size: 1rem;
            border-radius: 6px;
        }

        .btn-delete-topic:hover {
            opacity: 1;
            background: rgba(0, 0, 0, 0.1);
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex: 1;
            margin-left: 300px;
            padding: 24px 32px;
            max-width: 1200px;
        }

        /* Top Controls Bar */
        .toolbar {
            background: var(--bg-card);
            padding: 16px 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .toolbar-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-card);
            color: var(--text-main);
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn:hover {
            background: var(--bg-main);
        }

        .btn.active {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-warning {
            background: #fff8eb;
            color: #9c6216;
            border-color: #f0d5a8;
        }

        .btn-warning:hover {
            background: #faeed7;
        }

        .timer-badge {
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            padding: 6px 12px;
            background: var(--primary-light);
            color: var(--primary-hover);
            border-radius: 8px;
            font-size: 0.95rem;
        }

        /* Quiz Workspace Grid */
        .quiz-layout {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 24px;
            align-items: start;
        }

        .question-card {
            background: var(--bg-card);
            padding: 28px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .q-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 22px;
            color: var(--text-main);
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            text-align: left;
            padding: 14px 18px;
            border-radius: 10px;
            border: 2px solid var(--border);
            background: var(--bg-card);
            font-size: 1rem;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .option-btn.selected {
            border-color: var(--primary);
            background: var(--primary-light);
            font-weight: 600;
        }

        .option-btn.correct {
            border-color: var(--success);
            background: var(--success-bg);
            color: var(--success);
            font-weight: 600;
        }

        .option-btn.wrong {
            border-color: var(--danger);
            background: var(--danger-bg);
            color: var(--danger);
        }

        .q-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 26px;
            padding-top: 18px;
            border-top: 1px solid var(--border);
        }

        /* Question Navigator Palette */
        .palette-card {
            background: var(--bg-card);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .palette-title {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
        }

        .stats-bar {
            display: flex;
            gap: 10px;
            font-size: 0.8rem;
            margin-bottom: 14px;
            color: var(--text-muted);
        }

        .palette-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-height: 360px;
            overflow-y: auto;
            padding-right: 4px;
        }

        .p-item {
            aspect-ratio: 1;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-main);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .p-item.current {
            outline: 2px solid var(--primary);
            outline-offset: 1px;
        }

        .p-item.answered {
            background: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary-hover);
        }

        .p-item.correct {
            background: var(--success);
            color: #fff;
            border-color: var(--success);
        }

        .p-item.wrong {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }

        /* Result Modal / Banner */
        .result-banner {
            background: var(--primary-light);
            border: 1px solid var(--primary);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 20px;
            display: none;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .result-banner.show {
            display: flex;
        }

        .score-big {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--primary-hover);
        }

        .mobile-toggle {
            display: none;
            margin-bottom: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .shortcut-hint {
            margin-top: 14px;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }

        @media (max-width: 900px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
                padding: 16px;
            }
            .quiz-layout {
                grid-template-columns: 1fr;
            }
            .mobile-toggle {
                display: inline-flex;
            }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR CHUYÊN ĐỀ & UPLOAD -->
    <aside class="sidebar" id="sidebar">
        <div class="brand">🌿 Trắc Nghiệm Ôn Tập</div>

        <label class="upload-box" id="dropZone" for="jsonInput">
            <p>+ Nạp file JSON chuyên đề</p>
            <span>Chọn 1 hoặc nhiều file .json (hoặc kéo thả vào đây)</span>
            <input type="file" id="jsonInput" accept=".json" multiple>
        </label>

        <div class="topic-header">
            <span>Danh sách chuyên đề</span>
            <span id="topicCount">0</span>
        </div>
        <ul class="topic-list" id="topicList"></ul>
    </aside>

    <!-- KHU VỰC LÀM BÀI CHÍNH -->
    <main class="main-content">
        <button class="btn mobile-toggle" onclick="toggleSidebar()">☰ Danh sách chuyên đề</button>

        <!-- Thanh công cụ -->
        <div class="toolbar" id="toolbar">
            <div class="toolbar-group">
                <button class="btn active" id="btnModePractice" onclick="setMode('practice')">📖 Ôn tập ngay</button>
                <button class="btn" id="btnModeExam" onclick="setMode('exam')">⏱️ Thi thử tính giờ</button>
            </div>

            <div class="toolbar-group">
                <button class="btn" onclick="shuffleQuestions()" title="Đảo ngẫu nhiên câu hỏi và đáp án">🔀 Trộn đề</button>
                <button class="btn btn-warning" id="btnFilterWrong" onclick="toggleWrongFilter()">⚠️ Ôn câu sai (<span id="wrongCount">0</span>)</button>
                <button class="btn" onclick="resetCurrentQuiz()">🔄 Làm lại</button>
            </div>

            <div class="toolbar-group" id="examControls" style="display: none;">
                <span class="timer-badge" id="timerDisplay">00:00</span>
                <button class="btn btn-primary" id="btnSubmitExam" onclick="submitExam()">Nộp bài</button>
            </div>
        </div>

        <!-- Bảng kết quả sau khi nộp bài thi -->
        <div class="result-banner" id="resultBanner">
            <div>
                <div style="font-size: 0.9rem; color: var(--text-muted);">Kết quả bài thi thử</div>
                <div class="score-big" id="scoreText">0 / 0 (0.0 điểm)</div>
            </div>
            <button class="btn btn-primary" onclick="resetCurrentQuiz()">Làm lại đề này</button>
        </div>

        <!-- Vùng hiển thị câu hỏi -->
        <div id="workspace"></div>
    </main>

    <script>
        // --- DỮ LIỆU MẪU BAN ĐẦU ---
        const DEFAULT_TOPICS = [
            {
                id: "sample_phat_phap",
                name: "Lịch sử Đức Phật (Mẫu)",
                data: [
                    {"q":"Câu 1. Vào khoảng thế kỷ thứ mấy trước Tây lịch, dân tộc Aryan thâu phục nước Ấn Độ?","opts":["A. Thế kỷ thứ IV trước Tây lịch.","B. Thế kỷ thứ V trước Tây lịch.","C. Thế kỷ thứ VI trước Tây lịch.","D. Thế kỷ thứ VII trước Tây lịch."],"ans":2},
                    {"q":"Câu 2. Xã hội Ấn Độ thời Đức Phật có bao nhiêu giai cấp chính?","opts":["A. Hai giai cấp.","B. Ba giai cấp.","C. Bốn giai cấp.","D. Năm giai cấp."],"ans":2},
                    {"q":"Câu 3. Giai cấp Bà-la-môn gồm những thành phần nào?","opts":["A. Giới nông dân, công nhân.","B. Các đạo sĩ có kiến thức uyên bác.","C. Giới quý tộc, vua chúa.","D. Những người buôn bán."],"ans":1},
                    {"q":"Câu 4. Giai cấp Sát-đế-lỵ gồm những thành phần nào?","opts":["A. Giới quý tộc, dòng dõi vua chúa.","B. Giới nông dân, công nhân.","C. Những người làm tôi tớ.","D. Các đạo sĩ."],"ans":0},
                    {"q":"Câu 5. Giai cấp Phệ-xá chủ yếu gồm những thành phần nào?","opts":["A. Vua chúa và quý tộc.","B. Đạo sĩ và tu sĩ.","C. Nông, công, thương.","D. Tôi tớ lao động."],"ans":2}
                ]
            }
        ];

        // --- TRẠNG THÁI ỨNG DỤNG ---
        let topics = [];
        let currentTopicId = null;
        let workingQuestions = [];   // Danh sách câu hỏi đang làm (có thể đã trộn hoặc lọc)
        let currentIndex = 0;
        let userAnswers = {};        // { questionIndex: selectedOptionIndex }
        let mode = 'practice';       // 'practice' | 'exam'
        let examSubmitted = false;
        let filterWrongOnly = false;
        let wrongHistory = {};       // Lưu các câu làm sai theo topicId: { topicId: Set(originalIndex) }
        let timerInterval = null;
        let secondsElapsed = 0;

        // --- KHỞI TẠO & LOCAL STORAGE ---
        async function init() {
    const savedTopics = localStorage.getItem('quiz_topics_v1');
    const savedWrong = localStorage.getItem('quiz_wrong_v1');

    topics = savedTopics ? JSON.parse(savedTopics) : [];
    if (savedWrong) {
        const parsed = JSON.parse(savedWrong);
        for (let k in parsed) wrongHistory[k] = new Set(parsed[k]);
    }

    // Tự động tải các chuyên đề khai báo trong topics.json (nếu có)
    try {
        const res = await fetch('topics.json');
        if (res.ok) {
            const presetList = await res.json();
            for (const item of presetList) {
                const presetId = 'preset_' + item.file;
                // Chỉ thêm nếu chuyên đề này chưa có trong danh sách
                if (!topics.some(t => t.id === presetId)) {
                    const dataRes = await fetch(item.file);
                    if (dataRes.ok) {
                        const raw = await dataRes.json();
                        const qArray = Array.isArray(raw) ? raw : raw.data;
                        topics.unshift({ id: presetId, name: item.name, data: qArray });
                    }
                }
            }
            saveTopicsToStorage();
        }
    } catch (e) {
        console.log('Chạy offline hoặc chưa có topics.json');
    }

    if (topics.length > 0) {
        selectTopic(topics[0].id);
    } else {
        renderSidebar();
        renderEmptyState();
    }

    setupFileUpload();
    setupKeyboardShortcuts();
}

        function saveTopicsToStorage() {
            localStorage.setItem('quiz_topics_v1', JSON.stringify(topics));
        }

        function saveWrongHistory() {
            const serializable = {};
            for (let k in wrongHistory) {
                serializable[k] = Array.from(wrongHistory[k]);
            }
            localStorage.setItem('quiz_wrong_v1', JSON.stringify(serializable));
            updateWrongCounter();
        }

        // --- XỬ LÝ UPLOAD FILE JSON ---
        function setupFileUpload() {
            const input = document.getElementById('jsonInput');
            const dropZone = document.getElementById('dropZone');

            input.addEventListener('change', (e) => handleFiles(e.target.files));

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });

            dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));

            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                handleFiles(e.dataTransfer.files);
            });
        }

        async function handleFiles(fileList) {
            if (!fileList || fileList.length === 0) return;

            let lastAddedId = null;
            let addedCount = 0;

            for (const file of fileList) {
                if (!file.name.endsWith('.json')) continue;
                try {
                    const text = await file.text();
                    const parsed = JSON.parse(text);
                    // Hỗ trợ cả mảng [...] trực tiếp hoặc object { data: [...] }
                    const questionsArray = Array.isArray(parsed) ? parsed : parsed.data;

                    if (!Array.isArray(questionsArray) || questionsArray.length === 0) {
                        alert(`File "${file.name}" không đúng cấu trúc câu hỏi!`);
                        continue;
                    }

                    // Kiểm tra sơ bộ cấu trúc phần tử đầu tiên
                    if (!questionsArray[0].q || !Array.isArray(questionsArray[0].opts)) {
                        alert(`File "${file.name}" thiếu trường "q" hoặc "opts"!`);
                        continue;
                    }

                    const topicName = file.name.replace(/\.json$/i, '').replace(/[_-]/g, ' ');
                    const newTopic = {
                        id: 'topic_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5),
                        name: topicName,
                        data: questionsArray
                    };

                    topics.push(newTopic);
                    lastAddedId = newTopic.id;
                    addedCount++;
                } catch (err) {
                    alert(`Lỗi đọc file "${file.name}": File JSON không hợp lệ.`);
                }
            }

            if (addedCount > 0) {
                saveTopicsToStorage();
                selectTopic(lastAddedId);
            }
            document.getElementById('jsonInput').value = '';
        }

        function deleteTopic(e, id) {
            e.stopPropagation();
            if (!confirm('Xóa chuyên đề này khỏi danh sách?')) return;

            topics = topics.filter(t => t.id !== id);
            delete wrongHistory[id];
            saveTopicsToStorage();
            saveWrongHistory();

            if (currentTopicId === id) {
                if (topics.length > 0) {
                    selectTopic(topics[0].id);
                } else {
                    currentTopicId = null;
                    renderSidebar();
                    renderEmptyState();
                }
            } else {
                renderSidebar();
            }
        }

        // --- QUẢN LÝ CHUYÊN ĐỀ & CÂU HỎI ---
        function selectTopic(id) {
            currentTopicId = id;
            filterWrongOnly = false;
            document.getElementById('btnFilterWrong').classList.remove('active');
            loadQuestionsFromTopic();
            renderSidebar();
            if (window.innerWidth <= 900) {
                document.getElementById('sidebar').classList.remove('open');
            }
        }

        function loadQuestionsFromTopic() {
            const topic = topics.find(t => t.id === currentTopicId);
            if (!topic) return;

            if (!wrongHistory[currentTopicId]) {
                wrongHistory[currentTopicId] = new Set();
            }

            // Gắn thêm _origIdx để theo dõi câu sai ngay cả khi trộn đề
            let list = topic.data.map((item, idx) => ({
                ...item,
                opts: [...item.opts],
                _origIdx: idx
            }));

            if (filterWrongOnly) {
                list = list.filter(item => wrongHistory[currentTopicId].has(item._origIdx));
            }

            workingQuestions = list;
            currentIndex = 0;
            userAnswers = {};
            examSubmitted = false;
            document.getElementById('resultBanner').classList.remove('show');

            updateWrongCounter();
            resetTimer();
            renderQuiz();
        }

        function shuffleQuestions() {
            if (workingQuestions.length === 0) return;

            // Trộn thứ tự câu hỏi (Fisher-Yates)
            for (let i = workingQuestions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [workingQuestions[i], workingQuestions[j]] = [workingQuestions[j], workingQuestions[i]];
            }

            // Trộn thứ tự đáp án A, B, C, D trong từng câu và cập nhật lại index ans
            const prefixes = ['A. ', 'B. ', 'C. ', 'D. '];
            workingQuestions.forEach(q => {
                const correctText = q.opts[q.ans].replace(/^[A-D]\.\s*/i, '');
                const cleanOpts = q.opts.map(opt => opt.replace(/^[A-D]\.\s*/i, ''));

                for (let i = cleanOpts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [cleanOpts[i], cleanOpts[j]] = [cleanOpts[j], cleanOpts[i]];
                }

                q.ans = cleanOpts.indexOf(correctText);
                q.opts = cleanOpts.map((text, idx) => (prefixes[idx] || '') + text);
            });

            currentIndex = 0;
            userAnswers = {};
            examSubmitted = false;
            document.getElementById('resultBanner').classList.remove('show');
            resetTimer();
            renderQuiz();
        }

        function toggleWrongFilter() {
            const wrongSet = wrongHistory[currentTopicId];
            if (!filterWrongOnly && (!wrongSet || wrongSet.size === 0)) {
                alert('Bạn chưa có câu làm sai nào trong chuyên đề này!');
                return;
            }
            filterWrongOnly = !filterWrongOnly;
            document.getElementById('btnFilterWrong').classList.toggle('active', filterWrongOnly);
            loadQuestionsFromTopic();
        }

        function resetCurrentQuiz() {
            loadQuestionsFromTopic();
        }

        function updateWrongCounter() {
            const count = (currentTopicId && wrongHistory[currentTopicId]) ? wrongHistory[currentTopicId].size : 0;
            document.getElementById('wrongCount').textContent = count;
        }

        // --- CHẾ ĐỘ HỌC & ĐỒNG HỒ ---
        function setMode(newMode) {
            mode = newMode;
            document.getElementById('btnModePractice').classList.toggle('active', mode === 'practice');
            document.getElementById('btnModeExam').classList.toggle('active', mode === 'exam');
            document.getElementById('examControls').style.display = mode === 'exam' ? 'flex' : 'none';
            resetCurrentQuiz();
        }

        function resetTimer() {
            clearInterval(timerInterval);
            secondsElapsed = 0;
            updateTimerDisplay();
            if (mode === 'exam' && workingQuestions.length > 0) {
                timerInterval = setInterval(() => {
                    secondsElapsed++;
                    updateTimerDisplay();
                }, 1000);
            }
        }

        function updateTimerDisplay() {
            const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
            const secs = String(secondsElapsed % 60).padStart(2, '0');
            document.getElementById('timerDisplay').textContent = `${mins}:${secs}`;
        }

        // --- CHỌN ĐÁP ÁN & CHẤM ĐIỂM ---
        function selectOption(optIdx) {
            if (mode === 'practice' && userAnswers[currentIndex] !== undefined) return;
            if (mode === 'exam' && examSubmitted) return;

            userAnswers[currentIndex] = optIdx;
            const currentQ = workingQuestions[currentIndex];

            if (mode === 'practice') {
                if (optIdx === currentQ.ans) {
                    wrongHistory[currentTopicId].delete(currentQ._origIdx);
                } else {
                    wrongHistory[currentTopicId].add(currentQ._origIdx);
                }
                saveWrongHistory();
            }

            renderQuiz();
        }

        function submitExam() {
            if (examSubmitted) return;
            const unanswered = workingQuestions.length - Object.keys(userAnswers).length;
            if (unanswered > 0 && !confirm(`Bạn còn ${unanswered} câu chưa chọn. Vẫn muốn nộp bài?`)) {
                return;
            }

            examSubmitted = true;
            clearInterval(timerInterval);

            let correctCount = 0;
            workingQuestions.forEach((q, idx) => {
                if (userAnswers[idx] === q.ans) {
                    correctCount++;
                    wrongHistory[currentTopicId].delete(q._origIdx);
                } else {
                    wrongHistory[currentTopicId].add(q._origIdx);
                }
            });

            saveWrongHistory();
            const score10 = ((correctCount / workingQuestions.length) * 10).toFixed(2);
            document.getElementById('scoreText').textContent = `${correctCount} / ${workingQuestions.length} câu (${score10} điểm)`;
            document.getElementById('resultBanner').classList.add('show');
            renderQuiz();
        }

        // --- RENDER GIAO DIỆN ---
        function renderSidebar() {
            const listEl = document.getElementById('topicList');
            document.getElementById('topicCount').textContent = topics.length;

            listEl.innerHTML = topics.map(t => `
                <li class="topic-item ${t.id === currentTopicId ? 'active' : ''}" onclick="selectTopic('${t.id}')">
                    <div class="topic-info">
                        <div class="topic-title" title="${t.name}">${t.name}</div>
                        <div class="topic-meta">${t.data.length} câu hỏi</div>
                    </div>
                    <button class="btn-delete-topic" onclick="deleteTopic(event, '${t.id}')" title="Xóa chuyên đề">✕</button>
                </li>
            `).join('');
        }

        function renderEmptyState() {
            document.getElementById('workspace').innerHTML = `
                <div class="empty-state">
                    <h3>Chưa có chuyên đề nào</h3>
                    <p style="color: var(--text-muted); margin: 10px 0 20px;">Hãy bấm nút <b>"+ Nạp file JSON chuyên đề"</b> ở cột bên trái để bắt đầu ôn tập.</p>
                </div>
            `;
        }

        function renderQuiz() {
            const workspace = document.getElementById('workspace');
            if (workingQuestions.length === 0) {
                workspace.innerHTML = `<div class="empty-state"><h3>Không có câu hỏi nào trong danh sách này.</h3></div>`;
                return;
            }

            const q = workingQuestions[currentIndex];
            const chosen = userAnswers[currentIndex];
            const showResult = (mode === 'practice' && chosen !== undefined) || (mode === 'exam' && examSubmitted);

            // Render danh sách đáp án
            const optionsHtml = q.opts.map((optText, idx) => {
                let cls = 'option-btn';
                if (showResult) {
                    if (idx === q.ans) cls += ' correct';
                    else if (idx === chosen) cls += ' wrong';
                } else if (chosen === idx) {
                    cls += ' selected';
                }

                return `
                    <button class="${cls}" onclick="selectOption(${idx})" ${showResult ? 'disabled' : ''}>
                        <span>${optText}</span>
                    </button>
                `;
            }).join('');

            // Thống kê đúng/sai hiện tại
            let rightCnt = 0, wrongCnt = 0;
            workingQuestions.forEach((item, idx) => {
                if (userAnswers[idx] !== undefined) {
                    if (mode === 'practice' || examSubmitted) {
                        if (userAnswers[idx] === item.ans) rightCnt++;
                        else wrongCnt++;
                    }
                }
            });

            // Render lưới số câu hỏi
            const paletteHtml = workingQuestions.map((item, idx) => {
                let cls = 'p-item';
                if (idx === currentIndex) cls += ' current';
                if (userAnswers[idx] !== undefined) {
                    if (mode === 'practice' || examSubmitted) {
                        cls += (userAnswers[idx] === item.ans) ? ' correct' : ' wrong';
                    } else {
                        cls += ' answered';
                    }
                } else if (mode === 'exam' && examSubmitted) {
                    cls += ' wrong';
                }
                return `<button class="${cls}" onclick="goToQuestion(${idx})">${idx + 1}</button>`;
            }).join('');

            workspace.innerHTML = `
                <div class="quiz-layout">
                    <div>
                        <div class="question-card">
                            <div class="q-header">
                                <span>Câu <b>${currentIndex + 1}</b> / ${workingQuestions.length}</span>
                                <span>${mode === 'practice' ? 'Chế độ: Ôn tập' : 'Chế độ: Thi thử'}</span>
                            </div>
                            <div class="q-text">${q.q}</div>
                            <div class="options-list">${optionsHtml}</div>
                            <div class="q-footer">
                                <button class="btn" onclick="prevQuestion()" ${currentIndex === 0 ? 'disabled' : ''}>← Câu trước</button>
                                <button class="btn btn-primary" onclick="nextQuestion()" ${currentIndex === workingQuestions.length - 1 ? 'disabled' : ''}>Câu tiếp theo →</button>
                            </div>
                        </div>
                        <div class="shortcut-hint">Phím tắt: Bấm <b>1, 2, 3, 4</b> (hoặc <b>A, B, C, D</b>) để chọn đáp án • Bấm <b>← / →</b> để chuyển câu</div>
                    </div>

                    <div class="palette-card">
                        <div class="palette-title">
                            <span>Danh sách câu</span>
                            <span>${Object.keys(userAnswers).length}/${workingQuestions.length}</span>
                        </div>
                        ${(mode === 'practice' || examSubmitted) ? `
                            <div class="stats-bar">
                                <span style="color: var(--success); font-weight: 600;">✓ Đúng: ${rightCnt}</span>
                                <span style="color: var(--danger); font-weight: 600;">✕ Sai: ${wrongCnt}</span>
                            </div>
                        ` : ''}
                        <div class="palette-grid">${paletteHtml}</div>
                    </div>
                </div>
            `;
        }

        // --- ĐIỀU HƯỚNG & PHÍM TẮT ---
        function goToQuestion(idx) {
            currentIndex = idx;
            renderQuiz();
        }

        function prevQuestion() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuiz();
            }
        }

        function nextQuestion() {
            if (currentIndex < workingQuestions.length - 1) {
                currentIndex++;
                renderQuiz();
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function setupKeyboardShortcuts() {
            document.addEventListener('keydown', (e) => {
                if (workingQuestions.length === 0) return;
                const key = e.key.toUpperCase();

                if (key === 'ARROWLEFT') prevQuestion();
                else if (key === 'ARROWRIGHT') nextQuestion();
                else if (['1', 'A'].includes(key)) selectOption(0);
                else if (['2', 'B'].includes(key)) selectOption(1);
                else if (['3', 'C'].includes(key)) selectOption(2);
                else if (['4', 'D'].includes(key)) selectOption(3);
            });
        }

        // Khởi chạy ứng dụng
        init();
    </script>
</body>
</html>
